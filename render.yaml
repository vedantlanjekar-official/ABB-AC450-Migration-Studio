services:
  - type: web
    name: valmet-abb-ac450-api
    runtime: python
    region: oregon
    plan: free
    repo: https://github.com/valmet-intern-official/ABB-AC450-Migration-Studio
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PC_LIGHT_PDF_READ
        value: "1"
      - key: DB_LIGHT_PDF_READ
        value: "1"
      - key: ENABLE_PC_OCR
        value: "0"
